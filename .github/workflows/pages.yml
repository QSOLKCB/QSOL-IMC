name: Deploy QSOL-IMC Constellation

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check JavaScript syntax
        run: node --check app.js

      - name: Verify curated catalog and priority groups
        run: node scripts/validate-catalog.cjs

      - name: Verify static assets
        shell: bash
        run: |
          test -f index.html
          test -f styles.css
          test -f effects.css
          test -f app.js
          test -f assets/qsol-constellation.svg
          grep -q 'styles.css' index.html
          grep -q 'effects.css' index.html
          grep -q 'app.js' index.html

  deploy:
    needs: static-checks
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
