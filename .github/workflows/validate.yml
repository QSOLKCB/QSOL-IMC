name: Validate Constellation

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check JavaScript syntax
        run: node --check app.js

      - name: Verify curated catalog and priority groups
        run: node scripts/validate-catalog.cjs

      - name: Verify static assets
        shell: bash
        run: |
          test -f index.html
          test -f styles.css
          test -f effects.css
          test -f app.js
          test -f assets/qsol-constellation.svg
          grep -q 'styles.css' index.html
          grep -q 'effects.css' index.html
          grep -q 'app.js' index.html
